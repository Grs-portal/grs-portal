<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manager Login</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: url('/Screenshot 2025-11-05 104653.png') no-repeat center center fixed;
      background-size: cover;
      position: relative;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 0;
    }
  </style>
</head>

<body class="text-white min-h-screen flex items-center justify-center relative">

  <a href="/"
     class="absolute top-6 left-6 z-20 bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-xl font-semibold border border-white/30 backdrop-blur-md transition">
    ⬅ Back to Homepage
  </a>

  <div class="bg-white/10 backdrop-blur-md p-8 rounded-2xl shadow-2xl w-full max-w-sm relative z-10 border border-white/20">
    <h1 class="text-2xl font-semibold text-center mb-1 text-white">Manager Login</h1>
    <p class="text-center text-sm text-white/70 mb-6">Sign in to your manager portal</p>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm mb-1 text-white/80">Username</label>
        <input id="username" type="text"
               class="w-full px-3 py-2 rounded-lg bg-white/20 text-white border border-white/30 outline-none focus:ring-2 focus:ring-yellow-300/60"
               required />
      </div>

      <div>
        <label class="block text-sm mb-1 text-white/80">Password</label>
        <input id="password" type="password"
               class="w-full px-3 py-2 rounded-lg bg-white/20 text-white border border-white/30 outline-none focus:ring-2 focus:ring-yellow-300/60"
               required />
      </div>

      <button class="w-full bg-yellow-400 hover:bg-yellow-300 text-blue-900 py-2 rounded-lg font-medium transition">
        Login
      </button>
    </form>

    <p class="text-center mt-4 text-white/80">
      Info About Registry
      <a href="/homepage/register.html" class="text-yellow-300 font-semibold hover:underline">Here</a>
    </p>

    <div class="text-center mt-2 text-sm text-white/75">
      <a href="/homepage/login-student.html" class="text-yellow-300 font-semibold hover:underline">
        Sign in as student?
      </a>
      <span class="mx-2 text-white/40">•</span>
      <a href="/homepage/login-instructor.html" class="text-yellow-300 font-semibold hover:underline">
        Sign in as Teacher?
      </a>
    </div>

    <div id="err" class="hidden mt-4 text-center text-sm text-red-300"></div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const errEl = document.getElementById("err");

      const showErr = (msg) => {
        errEl.textContent = msg;
        errEl.classList.remove("hidden");
      };

      errEl.classList.add("hidden");

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json().catch(() => null);

        if (!res.ok || !data?.success) {
          showErr("Invalid username or password");
          return;
        }

        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("role", data.role);
        localStorage.setItem("userName", data.name);
        localStorage.setItem("username", data.username || username);

        window.location.href = data.redirect || "/manager";

      } catch (err) {
        console.error("Login error:", err);
        showErr("Server error. Check console.");
      }
    });
  </script>

</body>
</html>
