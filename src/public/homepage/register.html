<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Account</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-slate-900 text-white">

  <div class="w-full max-w-md bg-slate-800 p-8 rounded-2xl shadow-xl">
    <h1 class="text-2xl font-semibold text-center mb-6">Create Account</h1>

    <form id="registerForm" class="space-y-4">

      <!-- ROLE -->
      <select id="role" class="w-full p-2 rounded bg-slate-700">
        <option value="student">Student</option>
        <option value="instructor">Instructor</option>
        <option value="manager">Manager</option>
      </select>

      <!-- FULL NAME -->
      <input
        id="name"
        type="text"
        placeholder="Full name"
        class="w-full p-2 rounded bg-slate-700"
        required
      />

      <!-- USERNAME -->
      <input
        id="username"
        type="text"
        placeholder="Username"
        class="w-full p-2 rounded bg-slate-700"
        required
      />

      <!-- PASSWORD -->
      <div class="relative">
        <input
          id="password"
          type="password"
          placeholder="Password"
          class="w-full p-2 rounded bg-slate-700 pr-10"
          required
        />
        <button
          type="button"
          id="togglePwd"
          class="absolute right-2 top-2 text-sm opacity-70"
        >👁</button>
      </div>

      <!-- STUDENT COURSE (only for students) -->
      <div id="studentCourseWrap">
        <input
          id="course"
          type="text"
          placeholder="Course (students only)"
          class="w-full p-2 rounded bg-slate-700"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-green-500 hover:bg-green-600 py-2 rounded font-semibold"
      >
        Register
      </button>

      <p id="msg" class="text-center text-sm mt-2"></p>
    </form>

    <p class="text-center mt-4 text-sm opacity-80">
      Already have an account?
      <a href="/homepage/login.html" class="underline">Login</a>
    </p>
  </div>

  <!-- REGISTER SCRIPT -->
  <script>
    const pwd = document.getElementById("password");
    const togglePwd = document.getElementById("togglePwd");
    const role = document.getElementById("role");
    const courseWrap = document.getElementById("studentCourseWrap");
    const msg = document.getElementById("msg");

    togglePwd.onclick = () => {
      pwd.type = pwd.type === "password" ? "text" : "password";
    };

    role.onchange = () => {
      courseWrap.classList.toggle("hidden", role.value !== "student");
    };

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const payload = {
        role: role.value,
        name: document.getElementById("name").value.trim(),
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value.trim(),
        course: document.getElementById("course")?.value.trim()
      };

      if (!payload.name || !payload.username || !payload.password) {
        msg.textContent = "Please fill all required fields.";
        msg.className = "text-red-400 text-center";
        return;
      }

      try {
        const res = await fetch("/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!data.success) {
          msg.textContent = data.message || "Registration failed";
          msg.className = "text-red-400 text-center";
          return;
        }

        msg.textContent = "Account created! Redirecting...";
        msg.className = "text-green-400 text-center";

        setTimeout(() => {
          window.location.href = "/homepage/login.html";
        }, 900);

      } catch (err) {
        console.error(err);
        msg.textContent = "Server error";
        msg.className = "text-red-400 text-center";
      }
    });
  </script>
</body>
</html>
