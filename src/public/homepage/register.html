<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .fade-in { animation: fadeIn 0.5s ease-in-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    body {
      background: url('Screenshot 2025-11-05 104653.png') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Inter', sans-serif;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 24, 48, 0.85);
      z-index: 0;
    }
  </style>
</head>

<body class="flex items-center justify-center min-h-screen relative text-[#E0E1DD]">

  <!-- Form Card -->
  <div class="fade-in relative z-10 w-full max-w-md bg-[#1B263B]/90 backdrop-blur-lg p-8 rounded-2xl shadow-xl border border-[#415A77]/50">
    <h1 class="text-2xl font-semibold mb-2 text-center text-[#E0E1DD]">Create Account</h1>
    <p class="text-sm text-center mb-6 text-[#AAB5C5]">
      Choose your role and create login credentials.
    </p>

    <form id="registerForm" class="flex flex-col gap-4">
      <!-- Role -->
      <div>
        <label class="block text-sm mb-1 text-[#AAB5C5]">Role</label>
        <select id="role"
          class="w-full px-4 py-2 border border-[#415A77]/70 rounded-lg bg-[#273B54] text-[#E0E1DD] focus:outline-none focus:ring-2 focus:ring-[#778DA9]"
          required>
          <option value="student">Student</option>
          <option value="instructor">Instructor</option>
          <option value="manager">Manager</option>
        </select>
      </div>

      <!-- Display Name -->
      <div>
        <label class="block text-sm mb-1 text-[#AAB5C5]">Full name</label>
        <input type="text" id="name" placeholder="e.g. John Doe"
          class="w-full px-4 py-2 border border-[#415A77]/70 rounded-lg bg-[#273B54] text-[#E0E1DD] placeholder-[#AAB5C5]/70 focus:outline-none focus:ring-2 focus:ring-[#778DA9]"
          required />
      </div>

      <!-- Username -->
      <div>
        <label class="block text-sm mb-1 text-[#AAB5C5]">Username</label>
        <input type="text" id="username" placeholder="e.g. john"
          class="w-full px-4 py-2 border border-[#415A77]/70 rounded-lg bg-[#273B54] text-[#E0E1DD] placeholder-[#AAB5C5]/70 focus:outline-none focus:ring-2 focus:ring-[#778DA9]"
          required />
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm mb-1 text-[#AAB5C5]">Password</label>
        <input type="password" id="password" placeholder="Create a password"
          class="w-full px-4 py-2 border border-[#415A77]/70 rounded-lg bg-[#273B54] text-[#E0E1DD] placeholder-[#AAB5C5]/70 focus:outline-none focus:ring-2 focus:ring-[#778DA9]"
          required />
      </div>

      <!-- Student course (optional, only shows for students) -->
      <div id="studentCourseWrap" class="hidden">
        <label class="block text-sm mb-1 text-[#AAB5C5]">Course (optional)</label>
        <input type="text" id="course" placeholder="e.g. Intro to Programming"
          class="w-full px-4 py-2 border border-[#415A77]/70 rounded-lg bg-[#273B54] text-[#E0E1DD] placeholder-[#AAB5C5]/70 focus:outline-none focus:ring-2 focus:ring-[#778DA9]" />
        <p class="text-xs text-[#AAB5C5] mt-1">If you leave this empty, the server will assign a default course.</p>
      </div>

      <button type="submit"
        class="bg-[#415A77] hover:bg-[#778DA9] text-[#E0E1DD] py-2 rounded-lg font-medium transition">
        Register
      </button>

      <p id="msg" class="text-sm text-center text-[#AAB5C5]"></p>
    </form>

    <p class="text-sm text-center mt-6 text-[#AAB5C5]">
      Already have an account?
      <a href="login.html" class="text-[#E0E1DD] font-medium hover:underline">Back to Login</a>
    </p>
  </div>

  <script>
    const form = document.getElementById("registerForm");
    const roleEl = document.getElementById("role");
    const studentCourseWrap = document.getElementById("studentCourseWrap");
    const msg = document.getElementById("msg");

    function toggleStudentCourse() {
      const isStudent = roleEl.value === "student";
      studentCourseWrap.classList.toggle("hidden", !isStudent);
    }
    roleEl.addEventListener("change", toggleStudentCourse);
    toggleStudentCourse();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";

      const role = roleEl.value;
      const name = document.getElementById("name").value.trim();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const course = document.getElementById("course")?.value.trim();

      try {
        const res = await fetch("/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            role,
            name,
            username,
            password,
            course: role === "student" ? course : undefined
          })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok || !data.success) {
          msg.textContent = data.message || "Register failed. Try a different username.";
          return;
        }

        msg.textContent = "✅ Registered! Redirecting to login...";
        setTimeout(() => {
          window.location.href = "login.html";
        }, 900);

      } catch (err) {
        console.error("Register error:", err);
        msg.textContent = "Server error. Check console.";
      }
    });
  </script>
</body>
</html>
