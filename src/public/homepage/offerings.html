<style>
:root {
  --primary-color: #1e6c2f;
  --text-color: rgba(255,255,255,0.87);
}

body {
  margin: 0;
  background-color: #1a1a1a;
  font-family: "Inter", sans-serif;
  color: var(--text-color);
  overflow: hidden;
}

/* Cards container */
#cards-container {
  position: relative;
  width: 100vw;
  height: 91.6vh;
  overflow: hidden;
}

.card {
  position: absolute;
  left: 0;
  top: 0;
  width: 100vw;
  height: 100vh;
  background-size: cover;
  background-position: center;
  transition: opacity 0.8s ease;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-left: 80px;
  color: white;
  opacity: 0;
  z-index: 1;

  /* Required */
  position: absolute;
  overflow: hidden;
}

/* Dark overlay */
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.55); 
  z-index: 0;
}

.card > * {
  position: relative;
  z-index: 2;
}

.card:first-child::before {
  background: none;
}

.card.active {
  transform: translateX(0);
  z-index: 10;
}


/* Active card */
.card.active {
  opacity: 1;
  z-index: 10;
}

/* Card title overlay */
.card .card-title {
  font-family: "Oswald", sans-serif;
  font-size: 72px;
  font-weight: 600;
  margin-bottom: 16px;
}


.card .card-desc {
  font-size: 20px;
  max-width: 500px;
  line-height: 1.4;
}

/* CTA buttons */
.card .cta {
  margin-top: 32px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.card .cta .bookmark {
  background-color: var(--primary-color);
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: none;
  color: white;
  font-size: 24px;
  display: grid;
  place-items: center;
  cursor: pointer;
}
.card .cta .discover {
  border: 1px solid #fff;
  background-color: transparent;
  border-radius: 50px;
  color: white;
  padding: 12px 32px;
  font-size: 16px;
  text-transform: uppercase;
  cursor: pointer;
}

/* ================== Previews ================== */
#card-previews {
  position: absolute;
  bottom: 60px;
  left: 71%;
  transform: translateX(-50%);
  display: flex;
  gap: 16px;
  z-index: 20;
}

.preview-card {
  width: 250px;
  height: 300px;
  background-size: cover;
  background-position: center;
  border-radius: 12px;
  cursor: pointer;
  opacity: 0.8;
  transition: transform 0.3s ease, opacity 0.3s ease;
  display: flex;
  flex-direction: column;
  justify-content: flex-end; /* pushes title to bottom */
  padding: 12px;
  color: white;
  font-family: "Oswald", sans-serif;
  font-weight: 600;
  text-shadow: 0 2px 5px rgba(0, 0, 0, 0.7);
}

.preview-card:hover {
  transform: scale(1.05);
  opacity: 1;
}

.preview-card .preview-title {
  font-size: 1.8rem;
}

.progress-bar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 4px;
  background: rgba(255,255,255,0.2);
  z-index: 100;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: var(--primary-color);
  transition: width 5s linear;
}
</style>
</head>

<script>
const data = [
  {
    title:'What We Offer', 
    description:'Discover what you can do with us. Small steps, at your own pace. From getting acquainted to deepening your knowledge.', 
    image:'https://www.colorhexa.com/b7dfa9.png',
    link:''
  },
  {
    title:'Program & Activities', 
    description:'At the Green Recovery Space you can participate in activities, training and self-help methods that contribute to recovery, balance and well-being.', 
    image:'https://www.thenurtureproject.co.uk/wp-content/uploads/2023/10/MG_0860-1024x682.jpg',
    link:'program.html'
  },
  {
    title:'Our Projects', 
    description:'Discover all the amazing projects linked to green recovey space', 
    image:'https://images.stockcake.com/public/2/4/c/24c193c7-3ec4-4bfd-b24e-cb5b7909b5d5/nature-conservation-effort-stockcake.jpg',
    link:'construction.html'
  },
  {
    title: 'Stories & Experiences', 
    description: 'Personal recovery journeys from participants of the Green Recovery Space. Explore freely and read what resonates with you.', 
    image: 'https://sagaja.com/wp-content/uploads/2024/03/Spacery-zdjecie.jpeg',
    link:'stories.html'
  }
];

const cardsContainer = document.getElementById('cards-container');
const previewsContainer = document.getElementById('card-previews');

let activeIndex = 0;
let autoSlide;

// Create cards
data.forEach((item, index) => {

  const card = document.createElement('div');
  card.classList.add('card');
  if(index === 0) card.classList.add('active');

  if(item.image) {
    card.style.backgroundImage = `url(${item.image})`;
  } else {
    card.style.background = "linear-gradient(135deg, #1a1a1a, #2c2c2c)";
  }

  card.innerHTML = `
  <div class="card-title">${item.title}</div>
  <div class="card-desc">${item.description}</div>
  ${
    index !== 0 ? `<div class="cta">
      <button class="bookmark">★</button>
      <button class="discover" onclick="window.location.href='${item.link}'">Discover</button>
    </div>` : ''
  }
`;

  cardsContainer.appendChild(card);

// Create preview cards for all except first
if(index !== 0){
  const preview = document.createElement('div');
  preview.classList.add('preview-card');
  preview.style.backgroundImage = `url(${item.image})`;

  // Wrap title in a div
  const titleDiv = document.createElement('div');
  titleDiv.classList.add('preview-title');
  titleDiv.textContent = item.title;

  preview.appendChild(titleDiv);

  preview.addEventListener('click', () => {
    switchCard(index);
    resetAutoSlide();
  });
  previewsContainer.appendChild(preview);
}
});

const progressFill = document.querySelector('.progress-fill');

function switchCard(index){
  const allCards = document.querySelectorAll('.card');
  allCards.forEach((c,i)=>{
    c.classList.toggle('active', i === index);
  });

  activeIndex = index;
  updateProgress();
}

function startAutoSlide(){
  progressFill.style.transition = "none";
  progressFill.style.width = "0%";

  setTimeout(()=>{
    progressFill.style.transition = "width 5s linear";
    progressFill.style.width = "100%";
  },50);

  autoSlide = setInterval(() => {
    let nextIndex = (activeIndex + 1) % data.length;
    switchCard(nextIndex);
  }, 5000);
}

function resetAutoSlide(){
  clearInterval(autoSlide);
  startAutoSlide();
}

function updateProgress(){
  progressFill.style.transition = "none";
  progressFill.style.width = "0%";
  setTimeout(()=>{
    progressFill.style.transition = "width 5s linear";
    progressFill.style.width = "100%";
  },50);
}

startAutoSlide();
</script>
