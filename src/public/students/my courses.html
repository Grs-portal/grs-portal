<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Portal – My Courses</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-50 font-sans">
  <!-- Topbar -->
  <header class="sticky top-0 z-40 bg-green-500/60 backdrop-blur border-b border-green-500/60 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="project caribbean 1.png" class="w-10 h-10 rounded-lg object-contain" alt="Logo" />
        <span class="font-semibold text-lg">Student Portal</span>
      </div>
      <div class="flex items-center gap-3">
        <span id="studentName" class="font-medium"></span>
        <button id="logoutBtn" class="px-4 py-1.5 rounded-xl border border-white hover:bg-white hover:text-blue-700 transition font-medium">
          Logout
        </button>
      </div>
    </div>
  </header>

  <div class="flex flex-1">

    <!-- Sidebar -->
    <aside class="hidden lg:flex flex-col w-64 bg-white border-r border-gray-200 shadow-sm p-6 space-y-6">
      <nav>
        <ul class="space-y-2">
          <li><a href="my courses.html" class="block px-4 py-2 rounded-xl text-sm bg-blue-50 text-blue-700 font-semibold">My Courses</a></li>
          <li><a href="assignments.html" class="block px-4 py-2 rounded-xl text-sm text-gray-700 hover:bg-gray-100 transition">Assignments</a></li>
          <li><a href="enroll in courses.html" class="block px-4 py-2 rounded-xl text-sm text-gray-700 hover:bg-gray-100 transition">Enroll in Courses</a></li>
        </ul>
      </nav>

    <div class="space-y-4">
        <div class="bg-gray-50 rounded-2xl border border-gray-100 p-4 text-center shadow-sm">
          <p class="text-sm text-gray-500">Homework Tasks (open)</p>
          <p id="taskCount" class="text-2xl font-semibold text-gray-900">0</p>
        </div>
        <div class="bg-gray-50 rounded-2xl border border-gray-100 p-4 text-center shadow-sm">
          <p class="text-sm text-gray-500">Upcoming Deadlines (7 days)</p>
          <p id="deadlineCount" class="text-2xl font-semibold text-gray-900">0</p>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT FIXED CLOSING TAGS -->
    <main class="flex-1 max-w-6xl mx-auto px-4 py-10 space-y-10">

      <!-- My Courses -->
      <section>
        <h2 class="text-2xl font-semibold mb-4">My Courses</h2>
        <div id="myCoursesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        <p id="noCoursesMsg" class="text-gray-500 italic hidden mt-3">You are not enrolled in any courses.</p>
      </section>

    </main>
  </div>

  <!-- JS -->
  <script>
    const coursesData = [
      { id: 1, name: "Mental Health First Aid" },
      { id: 2, name: "JavaScript" },
      { id: 3, name: "English" },
      { id: 4, name: "Papiamentu" },
      { id: 5, name: "Information Technology" }
    ];

    const STORAGE_ENROLLED = "enrolledCourses";
    const STORAGE_NAME = "studentName";

    function loadJSON(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
      catch { return fallback; }
    }

    let enrolled = loadJSON(STORAGE_ENROLLED, []);

    const myCoursesList = document.getElementById("myCoursesList");
    const enrollList = document.getElementById("enrollList");
    const noCoursesMsg = document.getElementById("noCoursesMsg");
    const noEnrollMsg = document.getElementById("noEnrollMsg");

    function renderMyCourses() {
      myCoursesList.innerHTML = "";

      if (!enrolled.length) {
        noCoursesMsg.classList.remove("hidden");
        return;
      } else {
        noCoursesMsg.classList.add("hidden");
      }

      const myCourses = coursesData.filter(c => enrolled.includes(c.id));

      myCourses.forEach(course => {
        const card = document.createElement("div");
        card.className = "bg-white p-5 rounded-2xl shadow-sm border";
        card.innerHTML = `
          <h3 class="text-lg font-semibold mb-2">${course.name}</h3>
          <button class="unenrollBtn px-3 py-2 rounded-xl border border-blu-300 hover:bg-blue-600 hover:text-white transition" data-id="${course.id}">Unenroll</button>
        `;
        myCoursesList.appendChild(card);
      });
    }

    function renderEnrollList() {
      enrollList.innerHTML = "";

      const available = coursesData.filter(c => !enrolled.includes(c.id));

      if (!available.length) {
        noEnrollMsg.classList.remove("hidden");
        return;
      } else {
        noEnrollMsg.classList.add("hidden");
      }

      available.forEach(course => {
        const card = document.createElement("div");
        card.className = "bg-white p-5 rounded-2xl shadow-sm border";
        card.innerHTML = `
          <h3 class="text-lg font-semibold mb-2">${course.name}</h3>
          <button class="enrollBtn px-3 py-2 rounded-xl border border-blue-300 hover:bg-blue-600 hover:text-white transition" data-id="${course.id}">Enroll</button>
        `;
        enrollList.appendChild(card);
      });
    }

    function saveEnrolled() {
      localStorage.setItem(STORAGE_ENROLLED, JSON.stringify(enrolled));
    }

    document.addEventListener("click", (e) => {
      if (e.target.classList.contains("enrollBtn")) {
        const id = Number(e.target.dataset.id);
        if (!enrolled.includes(id)) enrolled.push(id);
        saveEnrolled();
        renderAll();
      }

      if (e.target.classList.contains("unenrollBtn")) {
        const id = Number(e.target.dataset.id);
        enrolled = enrolled.filter(c => c !== id);
        saveEnrolled();
        renderAll();
      }
    });

    function renderAll() {
      enrolled = loadJSON(STORAGE_ENROLLED, []);
      renderMyCourses();
      renderEnrollList();
    }

    const studentName = localStorage.getItem(STORAGE_NAME) || "Student";
    document.getElementById("studentName").textContent = `Welcome, ${studentName}`;

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem(STORAGE_NAME);
      localStorage.removeItem(STORAGE_ENROLLED);
      window.location.href = "student login.html";
    });

    renderAll();
  </script>
</body>
</html>
