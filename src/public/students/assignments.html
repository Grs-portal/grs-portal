<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Portal – Assignments</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="min-h-screen bg-gray-50 font-sans flex flex-col">
  <header class="sticky top-0 z-40 bg-green-500/60 backdrop-blur border-b border-green-500/60text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="project caribbean 1.png" class="w-10 h-10 rounded-lg object-contain" alt="Logo" />
        <span class="font-semibold text-lg">Student Portal</span>
      </div>
      <div class="flex items-center gap-3">
        <span id="studentName" class="font-medium"></span>
        <button id="logoutBtn" class="px-4 py-1.5 rounded-xl border border-white hover:bg-white hover:text-blue-700 transition font-medium">Logout</button>
      </div>
    </div>
  </header>

  <div class="flex flex-1">
    <aside class="hidden lg:flex flex-col w-64 bg-white border-r border-gray-200 shadow-sm p-6 space-y-6">
      <nav>
        <ul class="space-y-2">
          <li><a href="my courses.html" class="block px-4 py-2 rounded-xl text-sm hover:bg-gray-100 transition">My Courses</a></li>
          <li><a href="assignments.html" class="block px-4 py-2 rounded-xl text-sm bg-gray-100 text-gray-700 hover:bg-gray-100 transition font-semibold">Assignments</a></li>
          <li><a href="enroll in courses.html" class="block px-4 py-2 rounded-xl text-sm hover:bg-gray-100 transition">Enroll in Courses</a></li>
        </ul>
      </nav>
    </aside>

    <main class="flex-1 p-6 max-w-5xl mx-auto space-y-10">
      <section>
        <h2 class="text-2xl font-semibold mb-6">Assignments</h2>
        <div id="assignmentsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </section>
    </main>
  </div>

  <script>
    lucide.createIcons();

    const assignmentsList = document.getElementById("assignmentsList");

    const assignments = JSON.parse(localStorage.getItem("teacherAssignments") || "[]");

    function renderAssignments() {
      assignmentsList.innerHTML = "";

      if (assignments.length === 0) {
        assignmentsList.innerHTML = `<p class="col-span-full text-gray-500 italic text-center">No assignments have been posted yet.</p>`;
        return;
      }

      assignments.forEach((task, index) => {
        const div = document.createElement("div");
        div.className = "bg-white p-5 rounded-2xl shadow-sm border border-gray-100";

        div.innerHTML = `
          <h3 class="text-lg font-semibold mb-2">${task.title}</h3>
          <p class="text-gray-600 text-sm mb-2">Course: ${task.course}</p>
          <p class="text-gray-700 text-sm mb-4">${task.description}</p>
          <p class="text-gray-500 text-xs mb-4">Deadline: ${task.deadline}</p>
        `;

        assignmentsList.appendChild(div);
      });
    }

    document.getElementById("logoutBtn").addEventListener("click", () => {
      ['studentName', 'studentCode', 'enrolledCourses'].forEach(k => localStorage.removeItem(k));
      window.location.href = 'student login.html';
    });

    const studentName = localStorage.getItem("studentName") || "Student";
    document.getElementById("studentName").textContent = `Welcome, ${studentName}`;

    renderAssignments();
  </script>
</body>
</html>
