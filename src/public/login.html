<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Login</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      body {
  background: url('/Screenshot 2025-11-05 104653.png') no-repeat center center fixed;
  background-size: cover;
  position: relative;
}

body::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 0;
}

    }
  </style>
</head>

<body class="text-white min-h-screen flex items-center justify-center relative">

  <!-- LOGIN CARD -->
  <div class="bg-white/10 backdrop-blur-md p-8 rounded-2xl shadow-2xl w-full max-w-sm relative z-10 border border-white/20">

    <h1 class="text-2xl font-semibold text-center mb-6 text-white">Login</h1>

    <form id="loginForm" class="space-y-4">

      <div>
        <label class="block text-sm mb-1 text-white/80">Username</label>
        <input id="username" type="text"
               class="w-full px-3 py-2 rounded-lg bg-white/20 text-white border border-white/30"
               required />
      </div>

      <div>
        <label class="block text-sm mb-1 text-white/80">Password</label>
        <input id="password" type="password"
               class="w-full px-3 py-2 rounded-lg bg-white/20 text-white border border-white/30"
               required />
      </div>

      <button class="w-full bg-yellow-400 hover:bg-yellow-300 text-blue-900 py-2 rounded-lg font-medium transition">
        Login
      </button>

    </form>

    <p class="text-center mt-4 text-white/80">
      Don’t have an account?
      <a href="Register.html" class="text-yellow-300 font-semibold hover:underline">Register</a>
    </p>

  </div>


<script>
// ======================= LOGIN LOGIC =======================

const ACCOUNTS = {
  instructor: {
    username: "root",
    password: "1234",
    redirect: "instructor/index.html",
    name: "Instructor Root"
  },
  manager: {
    username: "manager",
    password: "9999",
    redirect: "manager/Manager.html",
    name: "Project Manager"
  }
};

document.getElementById("loginForm").addEventListener("submit", (e) => {
  e.preventDefault();

  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value.trim();

  for (let role in ACCOUNTS) {
    const acc = ACCOUNTS[role];

    if (user === acc.username && pass === acc.password) {

      localStorage.setItem("isLoggedIn", "true");
      localStorage.setItem("role", role);
      localStorage.setItem("userName", acc.name);
      localStorage.setItem("userAvatar", "");

      window.location.href = acc.redirect;
      return;
    }
  }

  alert("Invalid username or password.");
});
</script>

</body>
</html>
