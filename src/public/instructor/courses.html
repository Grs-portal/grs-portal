<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Courses</title>

  <!-- ... ✿°•∘ɷ∘•°✿ .. Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="css/courses.css">
</head>
<body class="bg-gray-100">

    <!--═════✿══╡°˖✧᯽ MAIN LAYOUT ᯽✧˖°╞══✿══════-->

  <div class="flex min-h-screen p-6 gap-6">

    <!--═════✿══╡°˖✧᯽ SIDEBAR ᯽✧˖°╞══✿══════-->
    
    <aside class="w-64 bg-white rounded-xl shadow p-5 sticky top-6 h-fit">
      <h2 class="text-xl font-semibold mb-4">Filters</h2>

      <div class="mb-4">
        <label class="block mb-1 font-medium">Search</label>
        <input type="text" placeholder="Search courses..." class="w-full px-3 py-2 border rounded-lg">
      </div>

      <div class="mb-4">
        <label class="block mb-1 font-medium">Teacher</label>
        <select class="w-full px-3 py-2 border rounded-lg">
          <option value="">All</option>
          <option>John Doe</option>
          <option>Maria Santos</option>
          <option>Kai Nakamura</option>
        </select>
      </div>

      <div class="mb-4">
        <label class="block mb-1 font-medium">Duration</label>
        <select class="w-full px-3 py-2 border rounded-lg">
          <option value="">Any</option>
          <option>1–2 hours</option>
          <option>3–5 hours</option>
          <option>6+ hours</option>
        </select>
      </div>

      <div class="mb-4">
        <label class="block mb-1 font-medium">Theme</label>
        <select class="w-full px-3 py-2 border rounded-lg">
          <option value="">All</option>
          <option>Design</option>
          <option>Programming</option>
          <option>Marketing</option>
          <option>Business</option>
        </select>
      </div>

      <button id="createCourseBtn" class="mt-6 w-full bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
        + Create Course
      </button>
    </aside>

    <!-- ... ✿°•∘ɷ∘•°✿ .. COURSES GRID -->
    <main class="flex-1">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="coursesGrid">
        <!-- Course cards will be injected here via JS -->
      </div>
    </main>

  </div>

  <!-- ... ✿°•∘ɷ∘•°✿ .. CREATE / EDIT COURSE MODAL ... ✿°•∘ɷ∘•°✿ .. -->

  <div id="courseModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl p-6 w-full max-w-lg relative">
      <button id="closeModal" class="absolute top-4 right-4 text-gray-500 hover:text-gray-800">&times;</button>
      <h3 class="text-lg font-semibold mb-4" id="modalTitle">Create Course</h3>

      <form id="courseForm" class="space-y-4">
        <div>
          <label class="block mb-1 font-medium">Title</label>
          <input type="text" name="title" class="w-full border px-3 py-2 rounded-lg" required>
        </div>

        <div>
          <label class="block mb-1 font-medium">Description</label>
          <textarea name="description" class="w-full border px-3 py-2 rounded-lg" rows="3"></textarea>
        </div>

        <div>
          <label class="block mb-1 font-medium">Location Type</label>
          <select name="locationType" class="w-full border px-3 py-2 rounded-lg">
            <option value="in-person">In-Person</option>
            <option value="online">Online</option>
          </select>
        </div>

        <div>
          <label class="block mb-1 font-medium">PDF URL</label>
          <input type="text" name="pdfUrl" class="w-full border px-3 py-2 rounded-lg">
        </div>

        <div>
          <label class="block mb-1 font-medium">PDF Name</label>
          <input type="text" name="pdfName" class="w-full border px-3 py-2 rounded-lg">
        </div>

        <button type="submit" class="w-full bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
          Save Course
        </button>
      </form>
    </div>
  </div>

  <script src="js/courses.js"></script>

</body>
</html>
