<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Access | Instructor Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .fade-in {
      animation: fadeIn 0.5s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Background Image + Overlay */
    body {
      background: url('Screenshot 2025-11-05 104653.png') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Inter', sans-serif;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 24, 48, 0.85); /* deep blue overlay */
      z-index: 0;
    }
  </style>
</head>

<body class="flex items-center justify-center min-h-screen relative text-[#E0E1DD]">

  <!-- Form Card -->
  <div class="fade-in relative z-10 w-full max-w-md bg-[#1B263B]/90 backdrop-blur-lg p-8 rounded-2xl shadow-xl border border-[#415A77]/50">
    <h1 class="text-2xl font-semibold mb-6 text-center text-[#E0E1DD]">Request Instructor Account</h1>

    <form id="registerForm" class="flex flex-col gap-4">
      <input type="text" id="firstName" placeholder="First Name"
        class="px-4 py-2 border border-[#415A77]/70 rounded-lg bg-[#273B54] text-[#E0E1DD] placeholder-[#AAB5C5]/70 focus:outline-none focus:ring-2 focus:ring-[#778DA9]" required />
      <input type="text" id="lastName" placeholder="Last Name"
        class="px-4 py-2 border border-[#415A77]/70 rounded-lg bg-[#273B54] text-[#E0E1DD] placeholder-[#AAB5C5]/70 focus:outline-none focus:ring-2 focus:ring-[#778DA9]" required />
      <input type="email" id="email" placeholder="Email Address"
        class="px-4 py-2 border border-[#415A77]/70 rounded-lg bg-[#273B54] text-[#E0E1DD] placeholder-[#AAB5C5]/70 focus:outline-none focus:ring-2 focus:ring-[#778DA9]" required />
      <input type="tel" id="phone" placeholder="Phone Number"
        class="px-4 py-2 border border-[#415A77]/70 rounded-lg bg-[#273B54] text-[#E0E1DD] placeholder-[#AAB5C5]/70 focus:outline-none focus:ring-2 focus:ring-[#778DA9]" required />
      <textarea id="reason" rows="3" placeholder="Why do you need access?"
        class="px-4 py-2 border border-[#415A77]/70 rounded-lg bg-[#273B54] text-[#E0E1DD] placeholder-[#AAB5C5]/70 focus:outline-none focus:ring-2 focus:ring-[#778DA9]" required></textarea>

      <button type="submit" class="bg-[#415A77] hover:bg-[#778DA9] text-[#E0E1DD] py-2 rounded-lg font-medium transition">Submit Request</button>
    </form>

    <p class="text-sm text-center mt-6 text-[#AAB5C5]">
      Already have an account?
      <a href="login.html" class="text-[#E0E1DD] font-medium hover:underline">Back to Login</a>
    </p>
  </div>

  <script>
    document.getElementById("registerForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const data = {
        firstName: document.getElementById("firstName").value.trim(),
        lastName: document.getElementById("lastName").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        reason: document.getElementById("reason").value.trim(),
      };

      alert("✅ Request submitted successfully! Our team will review your details and contact you via email.");
      console.log("Account request:", data);

      // Redirect back to login
      setTimeout(() => {
        window.location.href = "login.html";
      }, 1000);
    });
  </script>
</body>
</html>
